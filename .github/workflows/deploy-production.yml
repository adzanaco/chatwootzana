name: Deploy to Production

on:
  push:
    branches:
      - production
      - local-testing  # Also build for local-testing branch
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
  
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Only deploy to server when pushing to production branch
    if: github.ref == 'refs/heads/production'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          command_timeout: 30m
          timeout: 30m
          script: |
            # Navigate to app directory
            cd /opt/chatwoot
            
            # Pull latest changes
            git fetch origin production
            git reset --hard origin/production
            
            # Login to GitHub Container Registry (skip if public)
            # echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull latest images
            docker pull ghcr.io/${{ github.repository }}:production
            
            # Update containers
            docker-compose -f docker-compose.production-new.yml pull
            docker-compose -f docker-compose.production-new.yml down
            docker-compose -f docker-compose.production-new.yml up -d
            
            # Wait for services to be healthy
            sleep 20
            
            # Run migrations if needed
            docker-compose -f docker-compose.production-new.yml exec -T chatwoot-web bundle exec rails db:migrate
            
            # Clean up old images
            docker image prune -f
            
            # Health check
            curl -f http://localhost:3001/api/v1/health || exit 1
            
            echo "Deployment completed successfully!"