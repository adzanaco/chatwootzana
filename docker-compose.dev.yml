version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: chatwoot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatwoot_development
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: chatwoot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  chatwoot:
    image: chatwoot/chatwoot:latest
    container_name: chatwoot-app
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: chatwoot_development
      REDIS_URL: redis://redis:6379
      SECRET_KEY_BASE: replace_with_some_random_string_here_123
      FRONTEND_URL: http://localhost:3000
      ENABLE_ACCOUNT_SIGNUP: true
      RAILS_LOG_TO_STDOUT: true
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    command: bundle exec rails db:chatwoot_prepare && bundle exec rails s -p 3000 -b 0.0.0.0

volumes:
  postgres_data:
  redis_data: