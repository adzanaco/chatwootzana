version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg17
    platform: linux/amd64  # Ensures compatibility on M2 Mac
    container_name: chatwoot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatwoot_development
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chatwoot-network

  redis:
    image: redis:8-alpine
    platform: linux/amd64  # Ensures compatibility on M2 Mac
    container_name: chatwoot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chatwoot-network

  chatwoot-web:
    image: ghcr.io/adzanaco/chatwootzana:local-testing
    platform: linux/amd64  # Ensures compatibility on M2 Mac
    container_name: chatwoot-web
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: chatwoot_development
      REDIS_URL: redis://redis:6379
      SECRET_KEY_BASE: replace_with_some_random_string_here_123
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ENABLE_ACCOUNT_SIGNUP: true
      RAILS_LOG_TO_STDOUT: true
      RAILS_SERVE_STATIC_FILES: true
      ACTIVE_STORAGE_SERVICE: local
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    volumes:
      # Only mount storage for uploads
      - ./storage:/app/storage:cached
    command: >
      sh -c "
        bundle exec rails db:chatwoot_prepare &&
        bundle exec rails s -p 3000 -b 0.0.0.0
      "
    networks:
      - chatwoot-network

  chatwoot-sidekiq:
    image: ghcr.io/adzanaco/chatwootzana:local-testing
    platform: linux/amd64  # Ensures compatibility on M2 Mac
    container_name: chatwoot-sidekiq
    environment:
      RAILS_ENV: production
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: chatwoot_development
      REDIS_URL: redis://redis:6379
      SECRET_KEY_BASE: replace_with_some_random_string_here_123
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ENABLE_ACCOUNT_SIGNUP: true
      RAILS_LOG_TO_STDOUT: true
      ACTIVE_STORAGE_SERVICE: local
    depends_on:
      - postgres
      - redis
    volumes:
      - ./storage:/app/storage:cached
    command: bundle exec sidekiq -C config/sidekiq.yml
    networks:
      - chatwoot-network

volumes:
  postgres_data:
  redis_data:

networks:
  chatwoot-network:
    driver: bridge