version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: chatwoot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatwoot_development
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: chatwoot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  chatwoot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: chatwoot-app
    environment:
      RAILS_ENV: development
      NODE_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: chatwoot_development
      REDIS_URL: redis://redis:6379
      SECRET_KEY_BASE: replace_with_some_random_string_here_123
      FRONTEND_URL: http://localhost:3000
      ENABLE_ACCOUNT_SIGNUP: true
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
      - node_modules:/app/node_modules
    command: sh -c "bundle install && pnpm install && bundle exec rails db:create db:migrate && foreman start -f Procfile.dev"

volumes:
  postgres_data:
  redis_data:
  bundle_cache:
  node_modules: